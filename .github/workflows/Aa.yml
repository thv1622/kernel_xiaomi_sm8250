name: Rebuild drivers/kernelsu Folder

on:
  workflow_dispatch:

jobs:
  rebuild-ksu-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Чекaут репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ksu-test1
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Обновление сабмодуля
        run: |
          git submodule update --init --recursive

      - name: Пересоздание физической папки drivers/kernelsu
        run: |
          # Удаляем битую папку с потерянными файлами
          rm -rf drivers/kernelsu

          # Создаем чистую папку и полностью копируем исходники из KernelSU/kernel
          mkdir -p drivers/kernelsu
          cp -r KernelSU/kernel/* drivers/kernelsu/

      - name: Пуш обновленной папки
        run: |
          git add drivers/kernelsu
          git commit -m "fix: restore missing files in drivers/kernelsu" || echo "Нет изменений"
          git push origin ${{ github.ref_name }}
