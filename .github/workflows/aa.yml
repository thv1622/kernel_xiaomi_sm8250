name: Cherry-Pick Commits

on:
  workflow_dispatch:

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Чекaут текущего репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test-new1
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Подключение чужого репозитория
        run: |
          # Укажи ссылку на сторонний репозиторий вместо ЗАГЛУШКА_URL_РЕПОЗИТОРИЯ
          git remote add external_repo https://github.com/IzumiYouka/android_kernel_xiaomi_sm8250.git
          git fetch external_repo --no-recurse-submodules

      - name: Черри-пик списка коммитов
        run: |
          # Впиши хэши коммитов по порядку применения (от старого к новому)
          COMMITS=(
            "ad5d508d8bd751fff11e051f92685c6a5107549d"
            "82a9c29a5ba2857338526c71e172c3f29697cf4e"
            "3f95afc5471a34cdb2ea485fae602d6f0a236f8b"
          )

          for COMMIT in "${COMMITS[@]}"; do
            echo "Применяем коммит: $COMMIT"
            git cherry-pick $COMMIT
          done

      - name: Пуш в репозиторий
        run: |
          git push origin ${{ github.ref_name }}
